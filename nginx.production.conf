# Cloudflare -> Nginx Proxy Manager -> this nginx -> ASP.NET.
#
# Each hop appends to X-Forwarded-For, and ASP.NET's ForwardedHeaders middleware
# reads the *rightmost* entry, which would be NPM's address for every visitor —
# collapsing the login rate limiter onto a single partition. So we overwrite the
# header with Cloudflare's CF-Connecting-IP, which Cloudflare always sets to the
# real client and always overwrites, and fall back to the direct peer address for
# requests that arrive over Tailscale without passing through Cloudflare.
#
# This is only trustworthy while the origin cannot be reached directly. Restrict
# the VPS firewall to Cloudflare's published ranges, or use a Cloudflare Tunnel.
map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# An empty X-Forwarded-Proto makes the ASP.NET middleware discard the forwarded
# address too, because the two header lists no longer line up. Fall back to the
# scheme this hop actually saw.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving the backend through a variable means nginx
    # starts even when the backend is still coming up, and picks up its new address
    # after a redeploy instead of caching the first one forever.
    resolver 127.0.0.11 ipv6=off valid=10s;

    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        set $api_upstream http://backend:8080;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /hubs/ {
        set $hub_upstream http://backend:8080;
        proxy_pass $hub_upstream;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # SignalR holds its connection open; do not time it out mid-session.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /health/ {
        set $health_upstream http://backend:8080;
        proxy_pass $health_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;

        access_log off;
    }

    # Vite fingerprints these filenames, so they can be cached indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The shell must never be cached: a stale copy points at hashed bundles that no
    # longer exist after a deploy, and Cloudflare would happily serve it for hours.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # React Router owns client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
